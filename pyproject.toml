[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-density-workflow"
version = "0.3.1"
description = "A data-quality-aware Python/GIS workflow for physical urban-density indicators."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "branca>=0.7,<1",
  "duckdb>=1.1,<2",
  "folium>=0.18,<1",
  "geopandas>=1.0,<2",
  "matplotlib>=3.8,<4",
  "momepy>=0.9,<1",
  "numpy>=2.0,<3",
  "osmnx>=2.0,<3",
  "pandas>=2.0,<3",
  "Pillow>=10,<12",
  "psutil>=5.9,<8",
  "pyarrow>=15,<22",
  "pyogrio>=0.10,<1",
  "pyproj>=3.6,<4",
  "PyYAML>=6,<7",
  "rasterio>=1.4,<2",
  "requests>=2.31,<3",
  "shapely>=2.0,<3",
  "streamlit>=1.40,<2",
  "streamlit-folium>=0.23,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "folium>=0.18,<1",
  "uvicorn[standard]>=0.30,<1",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]
docs = ["mkdocs>=1.6,<2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["03_code/tests"]
addopts = "-ra"
